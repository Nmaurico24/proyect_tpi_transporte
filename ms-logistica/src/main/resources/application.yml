spring:
  application:
    name: ms-logistica

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ms_logistica_db}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:admin}
    password: ${DB_PASS:admin}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI:http://keycloak:8080/realms/tpi/protocol/openid-connect/certs}

server:
  port: 8082

logging:
  level:
    org.hibernate.SQL: debug
