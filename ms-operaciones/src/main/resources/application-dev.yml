spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ms_recursos_db}
    username: ${DB_USER:admin}
    password: ${DB_PASS:admin}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8082}

logging:
  level:
    root: INFO
